services:
  - type: web
    name: ricks-used-cars-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: >-
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 10000"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ricks-used-cars-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: https://ricks-used-cars-demo-kushovka.onrender.com

  - type: web
    name: ricks-used-cars-demo-kushovka
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://ricks-used-cars-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ricks-used-cars-db
    plan: free
    databaseName: ricks_used_cars
    user: ricks
